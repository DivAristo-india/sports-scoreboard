<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aristo Sports Day 2026 – Live Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root{
  --wine-900:#16030a; --wine-800:#2a0611; --wine-700:#43091a; --wine-600:#6a0f26;
  --gold-100:#fff3c4; --gold-300:#ffd978; --gold-500:#f0b73a; --gold-700:#b8741a;
  --silver-300:#e6ebf1; --silver-600:#8d98a6;
  --bronze-300:#f0b27a; --bronze-600:#a6561f;
  --live:#38e07b; --warn:#ffb020;
  --font: 'Oswald', 'Arial Narrow', Impact, 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--wine-900);color:#fff;font-family:var(--font);cursor:default}
body.idle{cursor:none}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(70vw 60vh at 50% -10%, rgba(240,183,58,.22), transparent 70%),
    radial-gradient(60vw 70vh at 100% 100%, rgba(106,15,38,.9), transparent 70%),
    radial-gradient(60vw 70vh at 0% 100%, rgba(106,15,38,.7), transparent 70%),
    linear-gradient(180deg, var(--wine-800), var(--wine-900));}
#bg::before{content:"";position:absolute;inset:-50%;
  background:repeating-conic-gradient(from 0deg at 50% 0%, rgba(255,217,120,.05) 0deg 4deg, transparent 4deg 14deg);
  transform-origin:50% 25%;animation:rays 60s linear infinite;mask-image:radial-gradient(circle at 50% 20%, #000, transparent 65%);-webkit-mask-image:radial-gradient(circle at 50% 20%, #000, transparent 65%)}
@keyframes rays{to{transform:rotate(360deg)}}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ---------- layout ---------- */
.app{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:15vh 1fr 4.2vh;padding:1.6vh 3vw 1vh;gap:1.2vh}

header{display:flex;align-items:center;justify-content:center;gap:2.6vw;min-height:0}
header .shield{height:100%;width:auto;filter:drop-shadow(0 0 2.2vh rgba(240,183,58,.45));animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7vh)}}
.title{display:flex;flex-direction:column;align-items:center;line-height:1;gap:.5vh}
.title b{font-size:6.4vh;font-weight:700;letter-spacing:.06em;
  background:linear-gradient(180deg,var(--gold-100),var(--gold-500) 60%,var(--gold-700));-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:inline-flex;align-items:center;gap:.8vh;font-size:2.4vh;font-weight:500;letter-spacing:.3em;color:#ff5a6a}
.live i{width:1.5vh;height:1.5vh;border-radius:50%;background:#ff3347;box-shadow:0 0 0 0 rgba(255,51,71,.7);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 1.4vh rgba(255,51,71,0)}100%{box-shadow:0 0 0 0 rgba(255,51,71,0)}}
.rule{flex:0 1 14vw;height:.5vh;border-radius:9px;background:linear-gradient(90deg,transparent,var(--gold-500))}
.rule.r{transform:scaleX(-1)}

#board{position:relative;min-height:0}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:4vh;letter-spacing:.2em;color:var(--gold-300);opacity:.8}
.empty::after{content:"";display:block;margin:2vh auto 0;width:10vh;height:.6vh;border-radius:9px;background:linear-gradient(90deg,transparent,var(--gold-500),transparent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{50%{transform:scaleX(.3);opacity:.4}}

/* ---------- rows ---------- */
.row{position:absolute;left:0;right:0;top:0;transition:transform .95s cubic-bezier(.22,.9,.28,1.12),opacity .6s;will-change:transform}
.row.leaving{opacity:0}
.card{position:relative;height:100%;display:grid;align-items:center;
  grid-template-columns:calc(var(--rh)*.78) calc(var(--rh)*1.05) minmax(0,1fr) auto auto;
  gap:calc(var(--rh)*.16);padding:0 calc(var(--rh)*.28) 0 calc(var(--rh)*.2);
  border-radius:calc(var(--rh)*.2);border:3px solid transparent;overflow:visible;
  background:linear-gradient(100deg,rgba(67,9,26,.92),rgba(30,5,13,.92)) padding-box,linear-gradient(100deg,rgba(255,255,255,.22),rgba(255,255,255,.06)) border-box;
  box-shadow:0 1.2vh 3vh rgba(0,0,0,.45)}
.card.enter{animation:enter .9s cubic-bezier(.2,.9,.25,1.05) both;animation-delay:var(--d,0s)}
@keyframes enter{from{opacity:0;transform:translateX(-14vw) scale(.96)}to{opacity:1;transform:none}}

.card.p1{background:linear-gradient(100deg,#5a0c20,#2a0611) padding-box,conic-gradient(from var(--a),#ffe9a3,#b8741a,#fff3c4,#d9961f,#ffe9a3) border-box;border-width:4px;
  animation:spin 6s linear infinite,glow 3s ease-in-out infinite;box-shadow:0 0 5vh rgba(240,183,58,.35),0 1.2vh 3vh rgba(0,0,0,.5)}
.card.p1.enter{animation:enter .9s cubic-bezier(.2,.9,.25,1.05) both,spin 6s linear infinite,glow 3s ease-in-out infinite;animation-delay:var(--d,0s),0s,0s}
@keyframes spin{to{--a:360deg}}
@keyframes glow{50%{box-shadow:0 0 8vh rgba(240,183,58,.55),0 1.2vh 3vh rgba(0,0,0,.5)}}
.card.p2{background:linear-gradient(100deg,#3b0b1b,#240713) padding-box,linear-gradient(100deg,var(--silver-300),var(--silver-600),var(--silver-300)) border-box;border-width:4px}
.card.p3{background:linear-gradient(100deg,#3b0b1b,#240713) padding-box,linear-gradient(100deg,var(--bronze-300),var(--bronze-600),var(--bronze-300)) border-box;border-width:4px}

/* shine sweep */
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);
  background-size:300% 100%;background-position:130% 0;opacity:0}
.card.p1::after{animation:shine 6s ease-in-out infinite;opacity:1}
@keyframes shine{0%,60%{background-position:130% 0}100%{background-position:-30% 0}}
.card.bump::after{opacity:1;animation:shineFast 1.1s ease-out 1}
@keyframes shineFast{from{background-position:130% 0}to{background-position:-30% 0}}
.card.bump{animation:bump .9s cubic-bezier(.2,.9,.3,1.3) 1}
.card.p1.bump{animation:bump .9s cubic-bezier(.2,.9,.3,1.3) 1,spin 6s linear infinite,glow 3s ease-in-out infinite}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.025)}100%{transform:scale(1)}}

/* rank */
.rank{display:grid;place-items:center;width:calc(var(--rh)*.78);height:calc(var(--rh)*.78);border-radius:50%;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.16),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.18);line-height:1;position:relative}
.rank .n{font-size:calc(var(--rh)*.4);font-weight:700;display:block;text-align:center}
.rank .o{font-size:calc(var(--rh)*.15);font-weight:500;letter-spacing:.08em;display:block;text-align:center;opacity:.85;margin-top:calc(var(--rh)*-.02)}
.p1 .rank{background:radial-gradient(circle at 30% 25%,var(--gold-100),var(--gold-500) 55%,var(--gold-700));color:#3a1604;border-color:#fff3c4;box-shadow:0 0 3vh rgba(240,183,58,.6)}
.p2 .rank{background:radial-gradient(circle at 30% 25%,#fff,var(--silver-300) 50%,var(--silver-600));color:#222b36;border-color:#fff}
.p3 .rank{background:radial-gradient(circle at 30% 25%,#ffe2c4,var(--bronze-300) 50%,var(--bronze-600));color:#3a1604;border-color:#ffe2c4}
.rank .tick{display:block}

/* logo */
.logo{width:calc(var(--rh)*1.05);height:calc(var(--rh)*.84);display:grid;place-items:center;position:relative}
.logo::before{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(255,225,150,.26),transparent 68%)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.55))}
.logo .ph{position:relative;font-size:calc(var(--rh)*.45);font-weight:700;color:var(--gold-300)}
.p1 .logo img{animation:logoPulse 3.2s ease-in-out infinite}
@keyframes logoPulse{50%{transform:scale(1.06)}}

.crown{position:absolute;left:calc(var(--rh)*.22 + var(--rh)*.78*.5 - var(--rh)*.2);top:calc(var(--rh)*-.3);width:calc(var(--rh)*.4);height:calc(var(--rh)*.3);
  opacity:0;transform:translateY(40%) scale(.5);transition:opacity .5s,transform .7s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 0 1vh rgba(240,183,58,.9));z-index:3}
.p1 .crown{opacity:1;transform:none;animation:bob 2.4s ease-in-out infinite .7s}
@keyframes bob{50%{transform:translateY(-6%) rotate(-3deg)}}

/* name */
.name{font-size:calc(var(--rh)*.36);font-weight:700;letter-spacing:.03em;line-height:1.02;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 .3vh .8vh rgba(0,0,0,.5)}
.p1 .name{text-shadow:none;background:linear-gradient(180deg,#fff,var(--gold-300));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .3vh .6vh rgba(0,0,0,.5))}

/* medals */
.medals{display:flex;gap:calc(var(--rh)*.14)}
.medal{display:flex;align-items:center;gap:calc(var(--rh)*.06);padding:calc(var(--rh)*.06) calc(var(--rh)*.12) calc(var(--rh)*.06) calc(var(--rh)*.07);border-radius:calc(var(--rh)*.5);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08)}
.medal svg{width:calc(var(--rh)*.28);height:calc(var(--rh)*.37);filter:drop-shadow(0 .3vh .5vh rgba(0,0,0,.5))}
.medal b{font-size:calc(var(--rh)*.31);font-weight:600;min-width:1ch;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.medal.pop svg{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
.medal.pop b{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.5) rotate(-8deg)}100%{transform:scale(1)}}

/* points */
.points{position:relative;display:flex;align-items:baseline;gap:calc(var(--rh)*.08);min-width:calc(var(--rh)*1.25);justify-content:flex-end}
.points b{font-size:calc(var(--rh)*.74);font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--gold-100),var(--gold-500) 62%,var(--gold-700));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .4vh .8vh rgba(0,0,0,.5))}
.points small{font-size:calc(var(--rh)*.17);font-weight:500;letter-spacing:.2em;color:var(--gold-300);opacity:.85}
.points b.tick{animation:tick .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes tick{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.plus{position:absolute;right:calc(var(--rh)*.3);top:calc(var(--rh)*-.42);font-size:calc(var(--rh)*.34);font-weight:700;color:#7dffb0;text-shadow:0 0 1.4vh rgba(56,224,123,.9);pointer-events:none;animation:rise 1.9s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(60%) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-110%) scale(1)}}

/* footer */
footer{display:flex;justify-content:space-between;align-items:center;font-size:1.9vh;letter-spacing:.12em;opacity:.78;min-height:0}
#conn{display:flex;align-items:center;gap:1vh}
#conn i{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--warn);transition:background .4s,box-shadow .4s}
#conn.live i{background:var(--live);box-shadow:0 0 1.2vh var(--live)}
#conn.offline i{background:var(--warn);animation:blink 1s infinite}
#conn.demo i{background:#5aa9ff}
@keyframes blink{50%{opacity:.25}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .row{transition-duration:.01ms}
}
</style>
</head>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const board = $('#board');
const num = v => { v = Number(v); return isFinite(v) && v > 0 ? v : 0; };
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const ord = n => { const s=['TH','ST','ND','RD'], v=n%100; return s[(v-20)%10]||s[v]||s[0]; };
function logoFor(key){
  const k = norm(key);
  if (k.includes('royal')) return LOGOS.royalriders;
  if (k.includes('alpha')) return LOGOS.alpha;
  if (k.includes('storm')) return LOGOS.stormbreakers;
  if (k.includes('velocity')) return LOGOS.velocity;
  return null;
}

/* ---------- number count-up ---------- */
function countTo(el, to, dur = 1300){
  const from = el._v ?? 0; el._v = to;
  if (el._raf) cancelAnimationFrame(el._raf);
  if (from === to){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), dec = Number.isInteger(to) ? 0 : 1;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    const v = from + (to - from) * e;
    el.textContent = dec ? v.toFixed(1) : String(Math.round(v));
    if (p < 1) el._raf = requestAnimationFrame(step); else el.textContent = fmt(to);
  };
  el._raf = requestAnimationFrame(step);
}
function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ---------- rows ---------- */
const rows = new Map();   // key -> row object
let order = [];           // sorted list currently displayed
let rh = 200, gap = 14, offsetY = 0;
let firstRender = true;

function medalHTML(type){
  return `<div class="medal ${type}" title="${type}"><svg><use href="#m-${type}"/></svg><b>0</b></div>`;
}
function makeRow(t, i){
  const el = document.createElement('div');
  el.className = 'row';
  const logo = logoFor(t.key) || logoFor(t.name);
  el.innerHTML = `
    <div class="card enter" style="--d:${(i*0.13).toFixed(2)}s">
      <svg class="crown"><use href="#crown"/></svg>
      <div class="rank"><span><span class="n">1</span><span class="o">ST</span></span></div>
      <div class="logo">${logo ? `<img alt="" src="${logo}">` : `<span class="ph">${(t.name[0]||'?')}</span>`}</div>
      <div class="name"></div>
      <div class="medals">${medalHTML('gold')}${medalHTML('silver')}${medalHTML('bronze')}</div>
      <div class="points"><b>0</b><small>PTS</small></div>
    </div>`;
  const r = {
    key: t.key, el, card: el.firstElementChild,
    n: el.querySelector('.rank .n'), o: el.querySelector('.rank .o'),
    nameEl: el.querySelector('.name'),
    pts: el.querySelector('.points b'), ptsWrap: el.querySelector('.points'),
    g: el.querySelector('.medal.gold'), s: el.querySelector('.medal.silver'), b: el.querySelector('.medal.bronze'),
    rank: null, points: null, gold: null, silver: null, bronze: null
  };
  r.card.addEventListener('animationend', e => { if (e.animationName === 'enter') r.card.classList.remove('enter'); });
  return r;
}

function cmp(a, b){
  return b.points - a.points || b.gold - a.gold || b.silver - a.silver || b.bronze - a.bronze || a.name.localeCompare(b.name);
}

function render(root){
  const src = (root && root.teams) || {};
  const list = Object.keys(src).map(k => {
    const t = src[k] || {};
    return { key:k, name:String(t.name || k).trim().toUpperCase(),
             gold:num(t.gold), silver:num(t.silver), bronze:num(t.bronze), points:num(t.points) };
  }).sort(cmp);

  let prev = null;
  list.forEach((t, i) => {
    t.rank = (prev && prev.points===t.points && prev.gold===t.gold && prev.silver===t.silver && prev.bronze===t.bronze) ? prev.rank : i + 1;
    prev = t;
  });

  const empty = $('#empty');
  if (list.length) { if (empty) empty.remove(); }
  else if (!rows.size && !empty) { board.innerHTML = '<div class="empty" id="empty">WAITING FOR SCORES</div>'; }
  else if (empty && !rows.size) { empty.textContent = 'WAITING FOR SCORES'; }

  const keys = new Set(list.map(t => t.key));
  for (const [k, r] of rows){
    if (!keys.has(k)){ r.el.classList.add('leaving'); setTimeout(() => r.el.remove(), 650); rows.delete(k); }
  }

  order = list.map(t => t.key);
  const isFirst = firstRender && list.length > 0;
  list.forEach((t, i) => {
    let r = rows.get(t.key);
    let created = false;
    if (!r){
      r = makeRow(t, i); rows.set(t.key, r); created = true;
      r.el.style.transition = 'none';
      board.appendChild(r.el);
    }
    r.idx = i;
    updateRow(r, t, created, isFirst);
  });
  layout(true);
  if (list.length) firstRender = false;
  rows.forEach(r => { r.el.style.transition = ''; });
}

function updateRow(r, t, created, initial){
  const oldRank = r.rank;
  r.rank = t.rank;
  r.nameEl.textContent = t.name;
  r.n.textContent = t.rank; r.o.textContent = ord(t.rank);
  const cls = t.rank <= 3 ? 'p' + t.rank : '';
  r.card.classList.remove('p1','p2','p3'); if (cls) r.card.classList.add(cls);

  const dur = created ? 1800 : 1300;
  const dPts = r.points == null ? 0 : t.points - r.points;
  if (r.points !== t.points){ countTo(r.pts, t.points, dur); if (!created) restart(r.pts, 'tick'); }
  [['gold','g'],['silver','s'],['bronze','b']].forEach(([k, el]) => {
    if (r[k] !== t[k]){
      countTo(r[el].querySelector('b'), t[k], dur);
      if (!created && r[k] != null && t[k] > r[k]) restart(r[el], 'pop');
    }
    r[k] = t[k];
  });
  r.points = t.points;

  if (!created && dPts > 0){
    restart(r.card, 'bump');
    const p = document.createElement('span'); p.className = 'plus'; p.textContent = '+' + fmt(dPts);
    r.ptsWrap.appendChild(p); setTimeout(() => p.remove(), 2000);
    setTimeout(() => burst(r.pts, 26), 250);
  }
  if (!created && oldRank != null && oldRank > t.rank && t.rank === 1){
    setTimeout(() => burst(r.card, 140, true), 500);
  }
}

function layout(){
  const H = board.clientHeight, n = Math.max(order.length, 1);
  gap = Math.max(8, H * 0.018);
  rh = Math.min((H - gap * (n - 1)) / n, H * 0.3);
  offsetY = Math.max(0, (H - (rh * n + gap * (n - 1))) / 2);
  board.style.setProperty('--rh', rh + 'px');
  rows.forEach(r => {
    r.el.style.height = rh + 'px';
    r.el.style.transform = `translateY(${offsetY + r.idx * (rh + gap)}px)`;
  });
}
new ResizeObserver(() => layout()).observe(board);

/* ---------- sparks / confetti canvas ---------- */
const cv = $('#fx'), ctx = cv.getContext('2d');
let W = 0, Hh = 0, dots = [], bursts = [];
function fit(){ W = cv.width = innerWidth; Hh = cv.height = innerHeight; }
addEventListener('resize', fit); fit();
const rnd = (a,b) => a + Math.random()*(b-a);
function dot(init){ return { x:rnd(0,W), y:init?rnd(0,Hh):Hh+10, r:rnd(.8,2.8), vy:-rnd(.2,.8), vx:rnd(-.25,.25), a:rnd(.25,.8), t:rnd(0,6.28) }; }
for (let i=0;i<70;i++) dots.push(dot(true));
function burst(el, n, big){
  const b = el.getBoundingClientRect();
  const cx = b.left + b.width/2, cy = b.top + b.height/2;
  const cols = ['#fff3c4','#ffd978','#f0b73a','#ffffff','#ff8a5b'];
  for (let i=0;i<n;i++){
    const ang = rnd(0, Math.PI*2), sp = rnd(2, big ? 11 : 6);
    bursts.push({ x: big ? rnd(b.left, b.right) : cx + rnd(-b.width/2, b.width/2), y: big ? cy + rnd(-b.height/3, b.height/3) : cy,
      vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - (big?4:2), life: 1, d: rnd(.008,.02), r: rnd(2,5), c: cols[(Math.random()*cols.length)|0], rot:rnd(0,6.28), vr:rnd(-.3,.3) });
  }
}
let lastT = 0;
function loop(t){
  requestAnimationFrame(loop);
  if (t - lastT < 30) return; lastT = t;
  ctx.clearRect(0,0,W,Hh);
  ctx.globalCompositeOperation = 'lighter';
  for (const d of dots){
    d.y += d.vy; d.x += d.vx + Math.sin(d.t += .02)*.15;
    if (d.y < -10) Object.assign(d, dot(false));
    ctx.globalAlpha = d.a * (.6 + .4*Math.sin(d.t*2));
    ctx.fillStyle = '#ffd978';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (let i = bursts.length-1; i >= 0; i--){
    const p = bursts[i];
    p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .985; p.life -= p.d*1.8; p.rot += p.vr;
    if (p.life <= 0){ bursts.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1, p.life*1.5);
    ctx.fillStyle = p.c;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillRect(-p.r, -p.r/2, p.r*2, p.r); ctx.restore();
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(loop);

/* ---------- status ---------- */
const conn = $('#conn'), connTxt = $('#connTxt'), upd = $('#upd');
function setStatus(kind){
  conn.className = kind;
  connTxt.textContent = kind === 'live' ? 'Live' : kind === 'demo' ? 'Demo mode' :
    kind === 'offline' ? 'Connection lost – showing last scores, reconnecting…' : 'Connecting…';
}
function showUpdated(ts){
  if (!ts) { upd.textContent = ''; return; }
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  upd.textContent = 'Last update ' + (d.toDateString() === now.toDateString() ? time : d.toLocaleDateString([], {day:'numeric', month:'short'}) + ' ' + time);
}

/* ---------- data (polls the Apps Script web app) ---------- */
let root = null, lastText = '', fails = 0;
const CACHE_KEY = 'aristo-scoreboard-last';
function accept(){
  render(root);
  showUpdated(root && root.updatedAt);
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(root)); } catch(e){}
}
async function poll(){
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(SCOREBOARD_URL + (SCOREBOARD_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache:'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error('http ' + res.status);
    const text = await res.text();
    const data = JSON.parse(text);
    if (!data || !data.teams) throw new Error('bad data');
    fails = 0; setStatus('live');
    if (text !== lastText){ lastText = text; root = data; accept(); }
  } catch(e){
    fails++;
    if (fails >= 2) setStatus('offline');          // keep showing the last good data
  } finally {
    clearTimeout(to);
    setTimeout(poll, fails ? Math.min(POLL_MS * (fails + 1), 15000) : POLL_MS);
  }
}
addEventListener('online', () => { fails = 0; });

/* ---------- demo mode ---------- */
function startDemo(){
  const names = ['ROYAL RIDERS','ALPHA','VELOCITY','STORM BREAKERS'];
  const teams = {}; names.forEach(n => teams[norm(n)] = { name:n, gold:0, silver:0, bronze:0, points:0 });
  const push = () => { root = { teams: JSON.parse(JSON.stringify(teams)), updatedAt: Date.now() }; render(root); showUpdated(root.updatedAt); };
  setStatus('demo'); push();
  setInterval(() => {
    const ks = Object.keys(teams), a = ks[(Math.random()*ks.length)|0];
    let b; do { b = ks[(Math.random()*ks.length)|0]; } while (b === a);
    const pts = [[6,3],[5,3],[10,7]][(Math.random()*3)|0];
    teams[a].points += pts[0]; teams[a].gold++; teams[b].points += pts[1]; teams[b].silver++;
    if (Math.random() < .4) { const c = ks[(Math.random()*ks.length)|0]; teams[c].bronze++; teams[c].points += 2; }
    push();
  }, 5000);
}

/* ---------- kiosk niceties ---------- */
let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 4000); };
['mousemove','mousedown','keydown','touchstart'].forEach(e => addEventListener(e, wake)); wake();
async function keepAwake(){ try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){} }
keepAwake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
// Reload the page every 12 h to keep a 24/7 TV healthy – only if the page is reachable
setInterval(async () => { try { await fetch(location.href, {cache:'no-store'}); location.reload(); } catch(e){} }, 12 * 3600 * 1000);

/* ---------- start ---------- */
(function init(){
  const demo = /[?&]demo/.test(location.search) || SCOREBOARD_URL.includes('PASTE-YOUR');
  if (demo) return startDemo();
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.teams){ root = c; render(root); showUpdated(root.updatedAt); setStatus('offline'); } } catch(e){}
  poll();
})();
</script>
